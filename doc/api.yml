openapi: 3.0.3
info:
  title: Movie Reservation API
  description: |
    REST API for managing movie reservations, showtimes, and seats.

    ## Authentication
    This API uses **JWT Bearer tokens** for authentication.
    - Public endpoints are accessible without a token.
    - User endpoints require a valid JWT token.
    - Admin endpoints require a valid JWT token with `ADMIN` role.

    ## Roles
    | Role | Description |
    |------|-------------|
    | `USER` | Can browse movies, reserve seats, and manage their reservations |
    | `ADMIN` | Full access including movie management, showtimes, and reporting |

    ## Error Handling
    All errors follow a consistent response format with `status`, `message`, and `timestamp`.

  version: 1.0.0
  contact:
    name: Movie Reservation API Support
    email: support@moviereservation.com

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.moviereservation.com/v1
    description: Production server

tags:
  - name: Auth
    description: Registration and login endpoints
  - name: Genres
    description: Movie genre management
  - name: Movies
    description: Movie catalog management
  - name: Showtimes
    description: Showtime scheduling and seat availability
  - name: Reservations
    description: Seat reservation management for authenticated users
  - name: Admin
    description: Admin-only endpoints for reporting and user management

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `/auth/login`

  parameters:
    UuidPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    IntPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1

    DateQueryParam:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
      example: "2026-07-15"

  schemas:
    # -------------------------
    # Auth
    # -------------------------
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          example: nel@example.com
        password:
          type: string
          minLength: 8
          example: securepassword123
        fullName:
          type: string
          example: Nel Rakoto

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: nel@example.com
        password:
          type: string
          example: securepassword123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    # -------------------------
    # Genre
    # -------------------------
    GenreRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Action

    GenreResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Action

    # -------------------------
    # Movie
    # -------------------------
    MovieRequest:
      type: object
      required: [title, genreId]
      properties:
        title:
          type: string
          example: Inception
        description:
          type: string
          example: A thief who steals corporate secrets through dream-sharing technology.
        posterUrl:
          type: string
          format: uri
          example: https://cdn.moviereservation.com/posters/inception.jpg
        genreId:
          type: integer
          example: 1

    MovieResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          example: Inception
        description:
          type: string
          example: A thief who steals corporate secrets through dream-sharing technology.
        posterUrl:
          type: string
          format: uri
          example: https://cdn.moviereservation.com/posters/inception.jpg
        genre:
          type: string
          example: Action
        createdAt:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

    # -------------------------
    # Showtime
    # -------------------------
    ShowtimeRequest:
      type: object
      required: [movieId, startTime, endTime, totalSeats]
      properties:
        movieId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        startTime:
          type: string
          format: date-time
          example: "2026-07-15T14:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-07-15T16:28:00Z"
        totalSeats:
          type: integer
          minimum: 1
          example: 120

    ShowtimeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        movieId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        movieTitle:
          type: string
          example: Inception
        startTime:
          type: string
          format: date-time
          example: "2026-07-15T14:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-07-15T16:28:00Z"
        totalSeats:
          type: integer
          example: 120
        availableSeats:
          type: integer
          example: 85

    # -------------------------
    # Seat
    # -------------------------
    SeatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        seatNumber:
          type: string
          example: A12
        status:
          type: string
          enum: [AVAILABLE, RESERVED]
          example: AVAILABLE

    # -------------------------
    # Reservation
    # -------------------------
    ReservationRequest:
      type: object
      required: [seatId, showtimeId]
      properties:
        seatId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        showtimeId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        seatNumber:
          type: string
          example: A12
        movieTitle:
          type: string
          example: Inception
        startTime:
          type: string
          format: date-time
          example: "2026-07-15T14:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

    # -------------------------
    # User
    # -------------------------
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        email:
          type: string
          format: email
          example: nel@example.com
        fullName:
          type: string
          example: Nel Rakoto
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        createdAt:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

    # -------------------------
    # Admin Report
    # -------------------------
    ReportResponse:
      type: object
      properties:
        totalReservations:
          type: integer
          example: 342
        totalRevenue:
          type: number
          format: double
          example: 5130.00
        occupancyRate:
          type: number
          format: double
          description: Percentage of seats reserved across all showtimes
          example: 78.5
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationResponse'

    # -------------------------
    # Error
    # -------------------------
    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found
        timestamp:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            message: Unauthorized
            timestamp: "2026-06-29T10:00:00Z"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            message: Access denied
            timestamp: "2026-06-29T10:00:00Z"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            message: Resource not found
            timestamp: "2026-06-29T10:00:00Z"

    Conflict:
      description: Resource already exists or conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 409
            message: Seat already reserved
            timestamp: "2026-06-29T10:00:00Z"

# -------------------------
# Paths
# -------------------------
paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account with `USER` role by default.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user and returns a JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /genres:
    get:
      tags: [Genres]
      summary: Get all genres
      description: Returns the full list of available movie genres. Public endpoint.
      security: []
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponse'
    post:
      tags: [Genres]
      summary: Create a genre
      description: Creates a new genre. Requires `ADMIN` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreRequest'
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /genres/{id}:
    delete:
      tags: [Genres]
      summary: Delete a genre
      description: Deletes a genre by ID. Requires `ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/IntPathParam'
      responses:
        '204':
          description: Genre deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /movies:
    get:
      tags: [Movies]
      summary: Get all movies
      description: Returns the movie catalog. Supports filtering by genre and date. Public endpoint.
      security: []
      parameters:
        - name: genre
          in: query
          description: Filter by genre name
          schema:
            type: string
            example: Action
        - $ref: '#/components/parameters/DateQueryParam'
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieResponse'
    post:
      tags: [Movies]
      summary: Create a movie
      description: Adds a new movie to the catalog. Requires `ADMIN` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRequest'
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /movies/{id}:
    get:
      tags: [Movies]
      summary: Get a movie by ID
      description: Returns details of a specific movie. Public endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Movies]
      summary: Update a movie
      description: Updates an existing movie. Requires `ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRequest'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Movies]
      summary: Delete a movie
      description: Removes a movie from the catalog. Requires `ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      responses:
        '204':
          description: Movie deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /movies/{id}/showtimes:
    get:
      tags: [Showtimes]
      summary: Get showtimes for a movie
      description: Returns all showtimes for a specific movie, optionally filtered by date. Public endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
        - $ref: '#/components/parameters/DateQueryParam'
      responses:
        '200':
          description: List of showtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowtimeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Showtimes]
      summary: Add a showtime to a movie
      description: Creates a new showtime for a movie. Requires `ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowtimeRequest'
      responses:
        '201':
          description: Showtime created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowtimeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /showtimes/{id}/seats:
    get:
      tags: [Showtimes]
      summary: Get seats for a showtime
      description: Returns all seats and their availability for a specific showtime. Public endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      responses:
        '200':
          description: List of seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations:
    get:
      tags: [Reservations]
      summary: Get my reservations
      description: Returns all reservations for the currently authenticated user.
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Reservations]
      summary: Create a reservation
      description: |
        Reserves a seat for a showtime.
        - The seat must be `AVAILABLE`.
        - Concurrent reservation attempts are handled with pessimistic locking to prevent overbooking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /reservations/{id}:
    delete:
      tags: [Reservations]
      summary: Cancel a reservation
      description: |
        Cancels an existing reservation.
        - Only **upcoming** showtimes can be cancelled.
        - Users can only cancel their own reservations.
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      responses:
        '204':
          description: Reservation cancelled
        '400':
          description: Cannot cancel a past reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reservations:
    get:
      tags: [Admin]
      summary: Get all reservations with report
      description: Returns all reservations with aggregated reporting data. Requires `ADMIN` role.
      responses:
        '200':
          description: Reservation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users:
    get:
      tags: [Admin]
      summary: Get all users
      description: Returns the full list of registered users. Requires `ADMIN` role.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}/promote:
    patch:
      tags: [Admin]
      summary: Promote a user to admin
      description: Grants `ADMIN` role to a user. Requires `ADMIN` role.
      parameters:
        - $ref: '#/components/parameters/UuidPathParam'
      responses:
        '200':
          description: User promoted to admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
